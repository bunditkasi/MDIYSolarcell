[project]
name = "mrdiy-solar-backend"
version = "0.1.0"
description = "MR.DIY Thailand — Enterprise Solar PV Monitoring System (Phase 1 MVP)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",

    # Database — SQLAlchemy 2.0 async + asyncpg.
    # Confined to app.infrastructure; app.domain must never import these.
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "greenlet>=3.1",
    "alembic>=1.14,<2",

    # Ingestion
    "httpx>=0.28,<0.29",
    "arq>=0.26,<0.27",
    "redis>=5.2,<6",
    "tenacity>=9.0,<10",

    # Secrets (Phase 2 swaps EnvSecretsProvider for VaultSecretsProvider)
    "hvac>=2.3,<3",

    "structlog>=24.4,<25",

    # ZoneInfo has no timezone database of its own on Windows, so
    # Settings.is_daylight() raises ZoneInfoNotFoundError for Asia/Bangkok
    # there. Linux containers carry the system tzdata, but pinning it here
    # keeps the package importable wherever it is installed.
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.28,<0.29",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
]
scraper = [
    "playwright>=1.49,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
